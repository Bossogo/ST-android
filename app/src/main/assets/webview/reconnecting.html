<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Connecting…</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1419;
      --fg: #e7ecf1;
      --muted: #9aa7b5;
      --accent: #6cb6ff;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f7fb;
        --fg: #15202b;
        --muted: #5b6b7c;
        --accent: #0b6bcb;
      }
    }
    html, body {
      margin: 0;
      height: 100%;
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      background: radial-gradient(120% 80% at 20% 0%, #1d2a38 0%, var(--bg) 55%);
      color: var(--fg);
    }
    main {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
      box-sizing: border-box;
    }
    h1 { font-size: 1.35rem; margin: 0 0 12px; font-weight: 650; }
    p { margin: 0; color: var(--muted); line-height: 1.45; max-width: 28rem; }
    .spinner {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3px solid color-mix(in srgb, var(--accent) 25%, transparent);
      border-top-color: var(--accent);
      animation: spin 0.9s linear infinite;
      margin-bottom: 22px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    button {
      margin-top: 22px;
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <div class="spinner" aria-hidden="true"></div>
    <h1>Connecting to local server…</h1>
    <p>Tavern Pocket is waiting for the on-device SillyTavern server. This page retries automatically.</p>
    <button type="button" id="retry">Retry now</button>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var target = params.get("target") || "http://127.0.0.1:8000/";
      var timer = null;

      function go() {
        location.replace(target);
      }

      document.getElementById("retry").addEventListener("click", go);
      timer = setInterval(go, 1500);
      setTimeout(go, 400);
      window.addEventListener("pagehide", function () {
        if (timer) clearInterval(timer);
      });
    })();
  </script>
</body>
</html>
